<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .road-line {
      animation: roadMove 0.4s linear infinite;
    }
    .speed-line {
      animation: speedMove 0.6s linear infinite;
    }
    .car-group {
      animation: carVibrate 0.15s ease-in-out infinite alternate;
    }
    .wheel {
      animation: wheelSpin 0.2s linear infinite;
    }
    .exhaust-flame {
      animation: flameFlicker 0.1s ease-in-out infinite alternate;
    }
    
    @keyframes roadMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-60px); }
    }
    @keyframes speedMove {
      0% { transform: translateX(800px); opacity: 0.8; }
      100% { transform: translateX(-200px); opacity: 0.1; }
    }
    @keyframes carVibrate {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-1.5px); }
    }
    @keyframes flameFlicker {
      0% { opacity: 0.4; transform: scaleX(0.8); }
      100% { opacity: 1; transform: scaleX(1.2); }
    }
  </style>

  <!-- Sky / Background -->
  <rect width="800" height="75" fill="url(#bgGrad)" />
  
  <!-- Horizon Line -->
  <line x1="0" y1="75" x2="800" y2="75" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- Speed Dust Lines in Sky -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.3">
    <line class="speed-line" x1="0" y1="20" x2="120" y2="20" style="animation-delay: 0s;"/>
    <line class="speed-line" x1="0" y1="40" x2="80" y2="40" style="animation-delay: 0.2s;"/>
    <line class="speed-line" x1="0" y1="60" x2="150" y2="60" style="animation-delay: 0.4s;"/>
  </g>

  <!-- Road Surface -->
  <rect y="75" width="800" height="45" fill="url(#roadGrad)" />
  <line x1="0" y1="118" x2="800" y2="118" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>

  <!-- Moving Road Dash Lines -->
  <g class="road-line" fill="#38BDF8" opacity="0.8" filter="url(#neonGlow)">
    <rect x="0" y="94" width="35" height="4" rx="2"/>
    <rect x="60" y="94" width="35" height="4" rx="2"/>
    <rect x="120" y="94" width="35" height="4" rx="2"/>
    <rect x="180" y="94" width="35" height="4" rx="2"/>
    <rect x="240" y="94" width="35" height="4" rx="2"/>
    <rect x="300" y="94" width="35" height="4" rx="2"/>
    <rect x="360" y="94" width="35" height="4" rx="2"/>
    <rect x="420" y="94" width="35" height="4" rx="2"/>
    <rect x="480" y="94" width="35" height="4" rx="2"/>
    <rect x="540" y="94" width="35" height="4" rx="2"/>
    <rect x="600" y="94" width="35" height="4" rx="2"/>
    <rect x="660" y="94" width="35" height="4" rx="2"/>
    <rect x="720" y="94" width="35" height="4" rx="2"/>
    <rect x="780" y="94" width="35" height="4" rx="2"/>
    <rect x="840" y="94" width="35" height="4" rx="2"/>
  </g>

  <!-- RETRO PIXEL RACING CAR (Centered & Driving Right) -->
  <g transform="translate(330, 52)">
    <g class="car-group">
      <!-- Exhaust Nitro Flame -->
      <polygon class="exhaust-flame" points="-18,28 -32,24 -24,28 -32,32" fill="#F59E0B" filter="url(#neonGlow)"/>
      <polygon class="exhaust-flame" points="-15,28 -24,26 -20,28 -24,30" fill="#EF4444"/>

      <!-- Car Shadow -->
      <ellipse cx="40" cy="38" rx="50" ry="4" fill="#000000" opacity="0.6"/>

      <!-- Main Body Chassis (Pixel Supercar Silhouette) -->
      <path d="M 0,26 L 15,14 L 35,10 L 65,10 L 85,20 L 105,24 L 110,32 L 0,32 Z" fill="url(#carGrad)"/>
      <path d="M 12,24 L 28,14 L 62,14 L 75,24 Z" fill="#0F172A"/> <!-- Windshield/Cabin -->
      <path d="M 32,15 L 58,15 L 70,23 L 32,23 Z" fill="#38BDF8" opacity="0.3"/> <!-- Glass reflection -->

      <!-- Front Bumper & Rear Spoiler -->
      <rect x="-4" y="16" width="6" height="12" fill="#0284C7" rx="1"/> <!-- Spoiler -->
      <rect x="-4" y="14" width="10" height="3" fill="#38BDF8"/>
      <rect x="104" y="26" width="8" height="6" fill="#38BDF8" filter="url(#neonGlow)"/> <!-- Headlight Glow -->

      <!-- Headlight Beam -->
      <polygon points="112,26 220,18 220,38 112,32" fill="#38BDF8" opacity="0.15"/>

      <!-- Rear Taillight -->
      <rect x="-2" y="24" width="3" height="5" fill="#EF4444" filter="url(#neonGlow)"/>

      <!-- Pixel Wheels -->
      <!-- Rear Wheel -->
      <g transform="translate(20, 32)">
        <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#F8FAFC" stroke-width="1.5"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#F8FAFC" stroke-width="1.5"/>
      </g>

      <!-- Front Wheel -->
      <g transform="translate(82, 32)">
        <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#F8FAFC" stroke-width="1.5"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#F8FAFC" stroke-width="1.5"/>
      </g>
    </g>
  </g>
</svg>
